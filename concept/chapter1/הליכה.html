<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הליכה על מסילה</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9A%B6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Heebo:wght@200;300;400;500;700&display=swap">
<style>
/* ══════════════════════════════════════════════════════════
   הליכה על מסילה — הרעיון של ניקה.

   הווידאו הוא לא סרט שמתנגן. הוא מסלול. כל פריים בו הוא מקום
   על הדרך, ו־W ו־S מזיזים אותנו לאורכה. השחקן לא צופה — הוא
   קובע איפה הוא נמצא, כמה מהר, ומתי לעצור.

   הטריק שמאפשר את זה: הווידאו מקודד כך שכל פריים הוא פריים
   מפתח. בלי זה כל קפיצה דורשת פענוח מהפריים המפתח הקודם,
   והגלילה מקרטעת.
   ══════════════════════════════════════════════════════════ */
:root{
  --wine:#4a1220;--gold:#d9a441;--gold-2:#f0cd85;--sand:#e8dcc4;--ink:#0b0705;
  --sans:'Heebo',system-ui,sans-serif;--serif:'Frank Ruhl Libre',serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{color:var(--sand);font-family:var(--serif);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--ink);cursor:crosshair}
video{position:absolute;top:50%;left:50%;min-width:100%;min-height:100%;width:auto;height:auto;
  transform:translate(-50%,-50%) scale(1.16);will-change:transform}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 92% at 50% 46%,transparent 44%,rgba(8,5,3,.32) 78%,rgba(8,5,3,.6) 100%)}

#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}
body.playing #hud{opacity:1}
#obj{position:absolute;top:38px;right:34px;text-align:right}
#obj .lbl{font-family:var(--sans);font-weight:400;font-size:.62rem;letter-spacing:.3em;
  color:var(--gold);margin-bottom:7px;text-shadow:0 2px 10px rgba(0,0,0,.95)}
#obj .txt{font-weight:400;font-size:1.28rem;text-shadow:0 2px 16px rgba(0,0,0,1)}
#obj .rule{height:1px;margin-top:10px;background:linear-gradient(to left,var(--gold),transparent)}

/* פס הדרך — כמה מהמסלול עברנו. זה גם המחוון וגם ההתקדמות. */
#trail{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);
  width:min(46vw,420px);height:2px;background:rgba(232,220,196,.16)}
#trail i{display:block;height:100%;width:0;background:var(--gold)}
#trail b{position:absolute;top:-9px;width:8px;height:20px;margin-right:-4px;
  background:var(--gold-2);border-radius:1px;box-shadow:0 0 10px rgba(217,164,65,.8)}
#trail span{position:absolute;top:14px;right:0;left:0;text-align:center;
  font-family:var(--sans);font-weight:200;font-size:.62rem;letter-spacing:.24em;
  color:rgba(232,220,196,.42)}

#keys{position:absolute;bottom:36px;right:34px;display:flex;gap:15px;
  font-family:var(--sans);font-weight:200;font-size:.66rem;letter-spacing:.14em;
  color:rgba(232,220,196,.45);text-shadow:0 2px 8px rgba(0,0,0,1)}
#keys b{font-weight:500;color:rgba(217,164,65,.9)}
#fps{position:absolute;bottom:36px;left:34px;font-family:ui-monospace,monospace;
  font-size:.68rem;color:rgba(232,220,196,.4);direction:ltr}

#gate{position:absolute;inset:0;z-index:9;display:grid;place-content:center;text-align:center;
  background:rgba(7,4,3,.9);transition:opacity .8s}
body.playing #gate{opacity:0;pointer-events:none}
#gate .a{font-weight:300;font-size:clamp(1.6rem,1.2rem + 2.2vw,2.7rem)}
#gate .b{font-family:var(--sans);font-weight:200;font-size:.76rem;letter-spacing:.28em;
  color:var(--gold);margin-top:16px}
#gate .c{font-family:var(--sans);font-weight:200;font-size:.72rem;letter-spacing:.1em;
  color:rgba(232,220,196,.42);margin-top:28px;line-height:2.1}
#go{margin-top:26px;font-family:var(--sans);font-weight:300;font-size:.76rem;letter-spacing:.2em;
  color:var(--sand);background:none;border:1px solid rgba(232,220,196,.24);padding:12px 30px;
  cursor:pointer;transition:.3s}
#go:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<div id="stage">
  <video id="v" src="poc/scrub/kb.mp4" muted playsinline preload="auto"></video>
  <div id="vig"></div>
  <div id="hud">
    <div id="obj"><div class="lbl">משימה</div><div class="txt">הגיעו אל הכעבה</div><div class="rule"></div></div>
    <div id="trail"><i></i><b></b><span>הדרך</span></div>
    <div id="keys"><span><b>W</b> קדימה</span><span><b>S</b> אחורה</span><span><b>SHIFT</b> מהר</span><span><b>עכבר</b> להסתכל</span></div>
    <div id="fps"></div>
  </div>
  <div id="gate">
    <div>
      <div class="a">הליכה על מסילה</div>
      <div class="b">בדיקת מכניקה</div>
      <div class="c">החזיקו <b>W</b> כדי ללכת · <b>S</b> לחזור · העכבר מזיז את המבט<br>
        עצרו באמצע. העולם עוצר איתכם — כי אתם קובעים איפה אתם.</div>
      <button id="go" type="button">להתחיל ללכת</button>
    </div>
  </div>
</div>

<script>
const v = document.getElementById('v')
const stage = document.getElementById('stage')
const bar = document.querySelector('#trail i')
const pip = document.querySelector('#trail b')
const fpsEl = document.getElementById('fps')

/* המיקום על הדרך, בשניות של הווידאו. זה לא זמן — זה מרחק. */
let pos = 0, dur = 4
const keys = new Set()
addEventListener('keydown', e => { keys.add(e.code); if (e.code === 'KeyW' || e.code === 'KeyS') e.preventDefault() })
addEventListener('keyup', e => keys.delete(e.code))

v.addEventListener('loadedmetadata', () => { dur = v.duration || 4 })

/* להסתכל — הפריים גדול מהמסך והעכבר מזיז אותו בתוכו */
let tx = 0, ty = 0, mx = 0, my = 0
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect()
  tx = ((e.clientX - r.left) / r.width - .5) * -2
  ty = ((e.clientY - r.top) / r.height - .5) * -2
})

/* מדידה: כמה פריימים *שונים* באמת הוצגו בשנייה. זו השאלה
   האמיתית — לא כמה פעמים הלולאה רצה. */
let shown = 0, lastT = -1, mark = performance.now(), fps = 0
if (v.requestVideoFrameCallback){
  const tick = () => { shown++; v.requestVideoFrameCallback(tick) }
  v.requestVideoFrameCallback(tick)
}

let prev = performance.now()
function frame(now){
  requestAnimationFrame(frame)
  const dt = Math.min(.05, Math.max(0, (now - prev) / 1000)) || 0; prev = now

  const fast = keys.has('ShiftLeft') || keys.has('ShiftRight')
  const spd = fast ? 1.9 : 0.85          /* שניות־וידאו לשנייה אמיתית */
  let d = 0
  if (keys.has('KeyW') || keys.has('ArrowUp')) d += 1
  if (keys.has('KeyS') || keys.has('ArrowDown')) d -= 1
  if (d !== 0){
    pos = Math.max(0, Math.min(dur - .05, pos + d * spd * dt))
    if (Math.abs(v.currentTime - pos) > .004) v.currentTime = pos
  }

  mx += (tx - mx) * .07
  my += (ty - my) * .07
  v.style.transform =
    `translate(calc(-50% + ${(mx * 3.6).toFixed(2)}%), calc(-50% + ${(my * 2.2).toFixed(2)}%)) scale(1.16)`

  const p = pos / dur
  bar.style.width = (p * 100) + '%'
  pip.style.right = (p * 100) + '%'

  if (now - mark > 500){
    fps = Math.round(shown / ((now - mark) / 1000))
    shown = 0; mark = now
    fpsEl.textContent = fps + ' fps · ' + (pos).toFixed(2) + 's'
  }
}
requestAnimationFrame(frame)

document.getElementById('go').addEventListener('click', () => {
  document.body.classList.add('playing')
  v.pause(); v.currentTime = 0
})

window.__walk = { at: () => pos, fps: () => fps, dur: () => dur }
</script>
</body>
</html>
