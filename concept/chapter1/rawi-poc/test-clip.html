<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8" /><title>בדיקת קליפ גולמי</title>
<style>body{margin:0;background:#241610}</style></head>
<body>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(innerWidth, innerHeight)
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 100)
camera.position.set(0, 1.3, 3.2); camera.lookAt(0, .95, 0)
scene.add(new THREE.HemisphereLight(0xffe8c0, 0x2a1a10, 1.4))
const key = new THREE.DirectionalLight(0xffd9a0, 2); key.position.set(2, 4, 2); scene.add(key)

const url = new URLSearchParams(location.search).get('f') ?? 'rawi2-chat.glb'
const g = await new Promise((res, rej) => new GLTFLoader().load('./' + url, res, undefined, rej))
scene.add(g.scene)
const mx = new THREE.AnimationMixer(g.scene)
mx.clipAction(g.animations[0]).play()
window.__ready = true
const clock = new THREE.Clock()
renderer.setAnimationLoop(() => { mx.update(clock.getDelta()); renderer.render(scene, camera) })
</script>
</body>
</html>
