<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>אסלאם</title>
<style>
  /* ===== Kedem — the project typeface ===== */
  @font-face{font-family:"Kedem";src:url("assets/fonts/kedem-light-aaa.otf") format("opentype");font-weight:300;font-display:swap}
  @font-face{font-family:"Kedem";src:url("assets/fonts/kedem-regular-aaa.otf") format("opentype");font-weight:400;font-display:swap}
  @font-face{font-family:"Kedem";src:url("assets/fonts/kedem-bold-aaa.otf") format("opentype");font-weight:700;font-display:swap}
  @font-face{font-family:"Kedem";src:url("assets/fonts/kedem-black-aaa.otf") format("opentype");font-weight:900;font-display:swap}

  :root{
    --cream:#fff7e5;
    --maroon:#4a101e;
    --maroon-hover:#5e1626;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#0b0805;
    font-family:"Kedem","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
    overflow:hidden;
    color:var(--cream);
  }

  #stage{position:fixed;inset:0;overflow:hidden;background:#0b0805}

  /* fallback backdrop (used only when the video is hidden, e.g. reduced motion) */
  .corridor{
    position:absolute;inset:0;z-index:1;
    width:100%;height:100%;object-fit:cover;object-position:center;
  }

  /* the entrance sequence, styled to feel like the scene itself */
  #intro{
    position:absolute;inset:0;z-index:2;
    width:100%;height:100%;object-fit:cover;object-position:center;
    background:#0b0805;
    pointer-events:none;               /* no native video interactions */
  }

  /* revealed content — sits ABOVE the video so the backdrop pixels never swap */
  #reveal{
    position:absolute;inset:0;z-index:4;
    pointer-events:none;
  }
  #reveal .veil{
    position:absolute;inset:0;opacity:0;
    transition:opacity 1100ms ease;
    background:
      radial-gradient(115% 85% at 50% 47%, rgba(0,0,0,0) 34%, rgba(0,0,0,.24) 78%, rgba(0,0,0,.5) 100%),
      linear-gradient(180deg, rgba(10,6,3,.3) 0%, rgba(10,6,3,0) 26%, rgba(10,6,3,0) 64%, rgba(10,6,3,.42) 100%);
  }
  #reveal .inner{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,3vh,36px);
    transform:translateY(-2vh);
    text-align:center;padding:5vw;
  }
  #reveal .brand{
    width:clamp(240px,43vw,720px);
    max-width:86vw;height:auto;
    filter:drop-shadow(0 10px 40px rgba(0,0,0,.55));
    opacity:0;transform:translateY(12px) scale(.985);
  }
  .enter{
    display:inline-flex;align-items:center;justify-content:center;
    padding:clamp(11px,1.45vh,17px) clamp(30px,3.4vw,50px);
    font-family:"Kedem",sans-serif;font-weight:700;
    font-size:clamp(16px,1.5vw,24px);letter-spacing:.5px;
    color:var(--cream);text-decoration:none;
    background:color-mix(in srgb, var(--maroon) 88%, transparent);
    border:1px solid rgba(255,247,229,.22);border-radius:999px;
    box-shadow:0 10px 28px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,247,229,.14);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    cursor:pointer;pointer-events:auto;
    opacity:0;transform:translateY(14px);
    transition:background .3s ease, transform .3s cubic-bezier(.2,.8,.2,1),
               box-shadow .3s ease, border-color .3s ease;
  }
  .enter:hover,.enter:focus-visible{
    background:var(--maroon-hover);border-color:rgba(255,247,229,.42);
    transform:translateY(-3px);
    box-shadow:0 16px 40px rgba(0,0,0,.48), 0 0 0 4px rgba(255,247,229,.06),
               inset 0 1px 0 rgba(255,247,229,.2);
    outline:none;
  }
  .enter:active{transform:translateY(-1px)}

  /* whole-screen "enter" affordance during the intro (invisible, not video-like) */
  #skip{
    position:absolute;inset:0;z-index:5;border:0;background:transparent;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  #skip:focus{outline:none}

  /* ---------- entered state ---------- */
  /* the video simply holds on its last frame — a clean, stable freeze (no motion = no jitter) */
  #stage.entered #skip{display:none}
  #stage.entered #reveal .veil{opacity:1}
  #stage.entered #reveal .brand{
    opacity:1;transform:none;
    transition:opacity 1100ms ease 500ms, transform 1300ms cubic-bezier(.2,.8,.2,1) 500ms;
  }
  #stage.entered #reveal .enter{
    opacity:1;transform:none;
    transition:opacity 820ms ease 1050ms,
               transform 820ms cubic-bezier(.2,.8,.2,1) 1050ms,
               background .3s ease, box-shadow .3s ease, border-color .3s ease;
  }

  /* reduced motion: no video, straight to the opening over the matching corridor */
  #stage.no-intro #intro{display:none}
  @media (prefers-reduced-motion: reduce){
    #stage.entered #intro{transition:none;transform:none}
    #stage.entered #reveal .veil,
    #stage.entered #reveal .brand,
    #stage.entered #reveal .enter{transition:opacity 220ms linear}
  }
</style>
</head>
<body>
  <main id="stage">
    <!-- fallback backdrop = the video's final frame (identical), for the no-video path -->
    <img class="corridor" src="assets/corridor.jpg" alt="" aria-hidden="true">

    <!-- the entrance sequence -->
    <video id="intro"
           muted autoplay playsinline preload="auto"
           poster="assets/exterior.jpg"
           disablepictureinpicture
           controlslist="nodownload noplaybackrate noremoteplayback"
           x-webkit-airplay="deny">
      <source src="entrance video.mp4" type="video/mp4">
    </video>

    <!-- revealed on top of the frozen last frame — backdrop never swaps -->
    <div id="reveal">
      <div class="veil" aria-hidden="true"></div>
      <div class="inner">
        <img class="brand" src="assets/logo-cream.png" alt="אסלאם">
        <a class="enter" id="enter" href="chapters.html">לכניסה</a>
      </div>
    </div>

    <!-- whole-screen "enter" affordance during the intro -->
    <button id="skip" aria-label="כניסה לאתר"></button>
  </main>

  <script>
    (function () {
      var stage = document.getElementById('stage');
      var video = document.getElementById('intro');
      var skip  = document.getElementById('skip');
      var entered = false;

      function enter() {
        if (entered) return;
        entered = true;
        try { video.pause(); } catch (e) {}
        stage.classList.add('entered');
        var btn = document.getElementById('enter');
        setTimeout(function () { try { btn.focus({ preventScroll: true }); } catch (e) {} }, 1200);
      }

      // reduced motion: skip the cinematic intro entirely, show opening over the corridor image
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { stage.classList.add('no-intro'); enter(); return; }

      // primary trigger: the entrance finished playing
      video.addEventListener('ended', enter);

      // safety net if 'ended' never fires
      var guard = setTimeout(enter, 9000);
      video.addEventListener('loadedmetadata', function () {
        var ms = (isFinite(video.duration) ? video.duration : 5.1) * 1000 + 400;
        clearTimeout(guard);
        guard = setTimeout(enter, ms);
      });
      // catch the last moment in case 'ended' is skipped
      video.addEventListener('timeupdate', function () {
        if (isFinite(video.duration) && video.duration - video.currentTime <= 0.05) enter();
      });

      // user may enter early — feels interactive, not like skipping a video
      skip.addEventListener('click', enter);
      document.addEventListener('keydown', function (e) {
        if (entered) return;
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { e.preventDefault(); enter(); }
      });

      // blocked autoplay: keep the exterior scene, start on first interaction
      function tryPlay() {
        var p = video.play();
        if (p && typeof p.then === 'function') {
          p.catch(function () {
            var kick = function () {
              document.removeEventListener('pointerdown', kick);
              video.play().catch(function () {});
            };
            document.addEventListener('pointerdown', kick, { once: true });
          });
        }
      }
      if (video.readyState >= 2) tryPlay();
      else video.addEventListener('canplay', tryPlay, { once: true });

      video.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    })();
  </script>
</body>
</html>
