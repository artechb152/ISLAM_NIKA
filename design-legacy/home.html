<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אסלאם — דף הבית</title>
<style>
  @font-face{font-family:"Kedem";src:url("assets/fonts/kedem-regular-aaa.otf") format("opentype");font-weight:400;font-display:swap}
  @font-face{font-family:"Kedem";src:url("assets/fonts/kedem-bold-aaa.otf") format("opentype");font-weight:700;font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Kedem","Heebo",system-ui,sans-serif;
    background:#fff7e5 url("background.png") center/cover no-repeat fixed;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    text-align:center;
    color:#4a101e;
    padding:6vw;
  }
  img.logo{width:clamp(260px,40vw,560px);height:auto;filter:drop-shadow(0 8px 26px rgba(74,16,30,.14))}
  p{font-size:clamp(16px,1.5vw,22px);color:#5b3a2e;letter-spacing:.4px}
  a.back{
    margin-top:8px;color:#841b1b;text-decoration:none;font-weight:700;
    border-bottom:1px solid rgba(132,27,27,.35);padding-bottom:2px;
  }
  a.back:hover{border-color:#841b1b}
</style>
</head>
<body>
  <img class="logo" src="logo dark.png" alt="אסלאם">
  <p>ברוכים הבאים — תוכן האתר ייבנה כאן בשלב הבא.</p>
  <a class="back" href="index.html">חזרה לכניסה</a>
</body>
</html>
